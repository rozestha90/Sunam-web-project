<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Loops - Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>🧶Sunam's Cozy Loops</h1>
        <p>Handmade Crochet with Love</p>
    </header>
    <nav><a href="index.html">🏠 Home</a><a href="about.html">🌷 About Us</a><a href="shop.html">🧸 Products</a><a
            href="contact.html">✉ Contact</a></nav>
    <main>
        <section class="content-box">
            <h2>Contact Us</h2>
            <p>Want to order a custom crochet product? Send us a message!</p>
            <p><b>Email:</b> sunamcozyloops@example.com</p>
            <p><b>Location:</b> Banepa, Nepal</p>
            <form id="contact-form"><label for="name">Your Name:</label><input id="name" type="text"
                    placeholder="Enter your name"><label for="email">Your Email:</label><input id="email" type="email"
                    placeholder="Enter your email"><label for="message">Your Message:</label><textarea id="message"
                    rows="5" placeholder="Write your message"></textarea><button type="submit">Send Message</button>
                <p id="form-message"></p>
            </form>
        </section>
    </main>
    <footer>
        <p>© <span id="year"></span> Sunam's Cozy Loops | Made with love ♡</p>
    </footer>
</body>

</html>
